<ion-header>
  <ion-toolbar>
    <ion-title>TaskApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>

    <ion-item *ngFor="let tarea of tareas">

      <ion-checkbox
        slot="start"
        [checked]="tarea.completada"
        (ionChange)="cambiarEstado(tarea.id)">
      </ion-checkbox>

      <ion-label [class.tarea-completada]="tarea.completada">

        <h2>{{ tarea.titulo }}</h2>

        <p>{{ tarea.descripcion }}</p>

      </ion-label>

      <ion-badge
        *ngIf="tarea.prioridad === 'Alta'"
        color="danger">
        Alta
      </ion-badge>

      <ion-badge
        *ngIf="tarea.prioridad === 'Media'"
        color="warning">
        Media
      </ion-badge>

      <ion-badge
        *ngIf="tarea.prioridad === 'Baja'"
        color="success">
        Baja
      </ion-badge>

      <ion-button
        fill="clear"
        color="danger"
        slot="end"
        (click)="eliminarTarea(tarea.id)">

        <ion-icon name="trash"></ion-icon>

      </ion-button>

    </ion-item>

  </ion-list>

  <ion-fab
    vertical="bottom"
    horizontal="end"
    slot="fixed">

    <ion-fab-button (click)="abrirFormulario()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>

  </ion-fab>

</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-title size="small">
      Mis tareas académicas
    </ion-title>
  </ion-toolbar>
</ion-footer>
